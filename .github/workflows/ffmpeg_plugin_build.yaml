          ./ParallelAllFFmpegTests.sh ${{ env.JOBS_NUM }} "${{ env.INPUT_FILES_PATH }}" "${{ github.workspace }}/install-dir/bin/ffmpeg" dec
   
  ffmpeg-9-0-performance-tests:
      needs: ffmpeg-9-0-linux-build
      runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
      timeout-minutes: 120
      steps:
        - name: 'Harden Runner'
          uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
          with:
            egress-policy: audit

        - name: 'Setup: Install dependencies'
          run: |
            sudo apt-get update
            sudo apt-get -y install numactl

        - name: 'Checkout repository'
          uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

        - name: 'Setup: Download build artifacts'
          uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
          with:
            name: ${{ needs.ffmpeg-9-0-linux-build.outputs.artifact_name }}
            path: install-dir

        - name: 'Setup: Make ffmpeg executable'
          run: sudo chmod -R 755 install-dir/

        - name: 'Run: ffmpeg plugin performance'
          working-directory: tests/scripts
          run: |
            export PATH="${{ github.workspace }}/install-dir/bin:$PATH"
            export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            ffmpeg -hide_banner -encoders 2>&1 | grep -i libsvtjpegxs
            ./PerformanceTestFfmpegPlugin.sh "${{ env.INPUT_FILES_PATH }}" 2>&1 | tee ffmpeg_plugin_performance.log

        - name: "Archive: upload performance results"
          if: always()
          uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
          with:
            name: ffmpeg-plugin-performance-results-${{ github.run_number }}
            retention-days: 90
            path: |
              tests/scripts/ffmpeg_results.csv
              tests/scripts/ffmpeg_plugin_performance.log
        
  ffmpeg-6-1-windows-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'windows-2022'
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'Install dependencies'
        working-directory: "${{ github.workspace }}"
        shell: pwsh
        run: ./.github/scripts/configure.ps1

      - name: 'install msys2 shell'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git mingw-w64-ucrt-x86_64-gcc cmake mingw-w64-ucrt-x86_64-yasm

      - name: 'install ffmpeg plugin'
        working-directory: "${{ github.workspace }}"
        shell: msys2 {0}
        run: |
           export ASM_NASM="${{ env.ASM_NASM }}"
           ./.github/scripts/build_ffmpeg_plugin_msys.sh 6.1

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.WINDOWS_ARTIFACTS_6_1 }}"
          retention-days: 30
          path: |
