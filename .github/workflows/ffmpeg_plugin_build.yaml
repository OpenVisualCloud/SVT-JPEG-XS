  ffmpeg-9-0-performance-tests:
      needs: ffmpeg-9-0-linux-build
      runs-on: ['self-hosted', 'linux', 'x64', 'valgrind', 'jpeg-perf']
      timeout-minutes: 120
      steps:
        - name: 'Harden Runner'
          uses: step-security/harden-runner@v2
          with:
            egress-policy: audit

        - name: 'Setup: Install dependencies'
          run: |
            sudo apt-get update
            sudo apt-get -y install numactl

        - name: 'Checkout repository'
          uses: actions/checkout@v4.1.7
          with:
            ref: ${{ github.event.workflow_run.head_sha || github.sha }}

        - name: 'Setup: Download build artifacts'
          uses: actions/download-artifact@v4.1.8
          with:
            name: ${{ needs.ffmpeg-9-0-linux-build.outputs.artifact_name }}
            path: install-dir

        - name: 'Setup: Make ffmpeg executable'
          run: sudo chmod -R 755 install-dir/

        - name: 'Run: ffmpeg plugin performance'
          working-directory: tests/scripts
          run: |
            export PATH="${{ github.workspace }}/install-dir/bin:$PATH"
            export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            ffmpeg -hide_banner -encoders 2>&1 | grep -i libsvtjpegxs
            ./PerformanceTestFfmpegPlugin.sh "${{ env.INPUT_FILES_PATH }}" 2>&1 | tee ffmpeg_plugin_performance.log

        - name: 'Publish: ffmpeg plugin performance summary'
          if: always()
          working-directory: tests/scripts
          run: |
            {
              echo "## FFmpeg Plugin Performance Results"
              echo ""
              if [ ! -f ffmpeg_results.csv ]; then
                echo "> ⚠️ Results CSV not found — the test may not have produced output."
              else
                echo "| Op | Resolution / Config | Result FPS | Baseline FPS | % of Target | Status |"
                echo "|----|---------------------|-----------|--------------|-------------|--------|"
                awk -F',' '
                  NR == 1 { next }
                  {
                    op=$1; tc=$2; status=$NF; pct=$(NF-1); target=$(NF-2); result=$(NF-3)
                    n=split(tc, a, "|")
                    label = (n > 7) ? a[1] " bpp=" a[7] " t=" a[8] : tc
                    icon = (status == "PASS") ? "✅" : "❌"
                    printf "| %s | %s | %s | %s | %s%% | %s %s |\n", op, label, result, target, pct, icon, status
                    if (status == "PASS") pass++; else fail++
                  }
                  END {
                    print ""
                    if (fail+pass == 0)
                      print "_No test results found in CSV._"
                    else if (fail == 0)
                      print "**Result: ✅ All " pass " tests passed**"
                    else
                      print "**Result: ❌ " fail " test(s) failed, " pass " passed**"
                  }
                ' ffmpeg_results.csv
              fi
            } >> "$GITHUB_STEP_SUMMARY"

        - name: "Archive: upload performance results"
          if: always()
          uses: actions/upload-artifact@v4.3.4
          with:
            name: ffmpeg-plugin-performance-results-${{ github.run_number }}
            retention-days: 90
            path: |
              tests/scripts/ffmpeg_results.csv
              tests/scripts/ffmpeg_plugin_performance.log

  windows-mingw-lib-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'windows-2022'
      timeout-minutes: 60
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@v4.1.7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 'Setup: Disable Windows Defender real-time scanning (speeds up many-small-file MinGW builds)'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: 'install msys2 shell'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          cache: true
          install: git mingw-w64-ucrt-x86_64-gcc cmake mingw-w64-ucrt-x86_64-yasm

      - name: 'Build: SVT-JPEG-XS (MinGW, static, Release) once, reused by all ffmpeg-plugin windows jobs'
        working-directory: "${{ github.workspace }}"
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-yasm mingw-w64-x86_64-diffutils mingw-w64-x86_64-winpthreads
          ./Build/linux/build.sh install --prefix "$(pwd)/install-dir" --no-app --static

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@v4.3.4
        with:
          name: "${{ env.WINDOWS_LIB_ARTIFACTS }}"
          retention-days: 1
          path: |
            install-dir/

