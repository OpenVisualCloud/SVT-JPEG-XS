          name: "${{ env.LINUX_ARTIFACTS_9_0 }}"
          retention-days: 30
          path: |
            install-dir/

  # ---------------------------------------------------------------------------------------------
  # ffmpeg plugin functional tests (tests/scripts/FFmpegDecoderConformanceTest.sh,
  # FFmpegDecoderMultiFramesTest.sh, FFmpegEncoderTest.sh), run against the ffmpeg binary built by
  # the corresponding *-linux-build job above, one job per Linux ffmpeg version. Runs on the same
  # self-hosted runners (with the same pre-staged /opt/samples bitstream set) as base_build.yaml's
  # linux-conformance-tests job, since these test scripts consume the exact same asset layout
  # (test_bitsreams/, reference_decode/, bitstream_multi_frames/, bitstream_invalid/,
  # encoder_tests/).
  # ---------------------------------------------------------------------------------------------

  ffmpeg-6-1-linux-tests:
      needs: [changes, ffmpeg-6-1-linux-build]
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@v4.1.7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 'Setup: Download build artifacts'
        uses: actions/download-artifact@v4.1.8
        with:
          name: "${{ env.LINUX_ARTIFACTS_6_1 }}"
          path: install-dir

      - name: 'Setup: Make ffmpeg executable'
        run: sudo chmod -R 755 install-dir/

      - name: 'ffmpeg plugin tests: run all'
        working-directory: ${{ github.workspace }}/tests/scripts
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib"
          ./ParallelAllFFmpegTests.sh ${{ env.JOBS_NUM }} "${{ env.INPUT_FILES_PATH }}" "${{ github.workspace }}/install-dir/bin/ffmpeg" dec 2>&1 | tee ffmpeg_functional_tests.log

      - name: 'Publish: FFmpeg functional test summary'
        if: always()
        working-directory: ${{ github.workspace }}/tests/scripts
        run: |
          {
            echo "## FFmpeg Plugin Functional Tests"
            echo ""
            if [ ! -f ffmpeg_functional_tests.log ]; then
              echo "> ⚠️ Test log not found — the test may not have run."
            else
              echo "| Suite | Executed | Passed | Failed | Status |"
              echo "|-------|----------|--------|--------|--------|"
              awk '
                /^RUN FFMPEG DECODER CONFORMANCE TEST/ { flush(); suite="Decoder Conformance" }
                /^RUN FFMPEG DECODER MULTI FRAMES TEST/ { flush(); suite="Decoder Multi-Frames" }
                /^RUN FFMPEG ENCODER TEST/             { flush(); suite="Encoder" }
                /Tests execute:/  { total += $3 }
                /^FAIL [^!]/      { fails++ }
                END {
                  flush()
                  print ""
                  if (grand_fails == 0)
                    print "**Result: ✅ All " grand_total " tests passed**"
                  else
                    print "**Result: ❌ " grand_fails " test(s) failed, " (grand_total - grand_fails) " passed**"
                }
                function flush() {
                  if (suite != "") {
                    icon = (fails == 0) ? "✅" : "❌"
                    printf "| %s | %d | %d | %d | %s |\n", suite, total, total-fails, fails, icon
                    grand_total += total; grand_fails += fails
                    total=0; fails=0; suite=""
                  }
                }
              ' ffmpeg_functional_tests.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

