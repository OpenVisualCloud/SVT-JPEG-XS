name: ffmpeg Plugin Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  INPUT_FILES_PATH: /opt/samples
  JOBS_NUM: 100
  LINUX_ARTIFACTS_6_1: linux-ffmpeg-6-1-build-${{ github.run_number }}
  LINUX_ARTIFACTS_7_0: linux-ffmpeg-7-0-build-${{ github.run_number }}
  LINUX_ARTIFACTS_7_1: linux-ffmpeg-7-1-build-${{ github.run_number }}
  LINUX_ARTIFACTS_8_0: linux-ffmpeg-8-0-build-${{ github.run_number }}
  LINUX_ARTIFACTS_8_1: linux-ffmpeg-8-1-build-${{ github.run_number }}
  LINUX_ARTIFACTS_9_0: linux-ffmpeg-9-0-build-${{ github.run_number }}
  WINDOWS_ARTIFACTS_6_1: windows-ffmpeg-6-1-build-${{ github.run_number }}
  WINDOWS_ARTIFACTS_7_0: windows-ffmpeg-7-0-build-${{ github.run_number }}
  WINDOWS_ARTIFACTS_7_1: windows-ffmpeg-7-1-build-${{ github.run_number }}
  WINDOWS_ARTIFACTS_8_0: windows-ffmpeg-8-0-build-${{ github.run_number }}
  WINDOWS_ARTIFACTS_8_1: windows-ffmpeg-8-1-build-${{ github.run_number }}
  WINDOWS_ARTIFACTS_9_0: windows-ffmpeg-9-0-build-${{ github.run_number }}
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.ffmpeg_plugin_build == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v2
        id: filter
        with:
          filters: .github/config/path_filters.yaml

  ffmpeg-6-1-linux-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'ubuntu-22.04'
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit
      - name: 'Setup:  Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake nasm make gcc g++ pkg-config

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'install ffmpeg plugin'
        run: .github/scripts/build_ffmpeg_plugin.sh 6.1 y

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.LINUX_ARTIFACTS_6_1 }}"
          retention-days: 30
          path: |
            install-dir/

  ffmpeg-7-0-linux-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'ubuntu-22.04'
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup:  Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake nasm make gcc g++ pkg-config

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'install ffmpeg plugin'
        run: .github/scripts/build_ffmpeg_plugin.sh 7.0 y

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.LINUX_ARTIFACTS_7_0 }}"
          retention-days: 30
          path: |
            install-dir/

  ffmpeg-7-1-linux-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'ubuntu-22.04'
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup:  Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake nasm make gcc g++ pkg-config

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'install ffmpeg plugin'
        run: .github/scripts/build_ffmpeg_plugin.sh 7.1 y

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.LINUX_ARTIFACTS_7_1 }}"
          retention-days: 30
          path: |
            install-dir/

  ffmpeg-8-0-linux-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'ubuntu-22.04'
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup:  Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake nasm make gcc g++ pkg-config

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'install ffmpeg plugin'
        run: .github/scripts/build_ffmpeg_plugin.sh 8.0 y

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.LINUX_ARTIFACTS_8_0 }}"
          retention-days: 30
          path: |
            install-dir/

  ffmpeg-8-1-linux-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'ubuntu-22.04'
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup:  Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake nasm make gcc g++ pkg-config

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'install ffmpeg plugin'
        run: .github/scripts/build_ffmpeg_plugin.sh 8.1 y n

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.LINUX_ARTIFACTS_8_1 }}"
          retention-days: 30
          path: |
            install-dir/

  ffmpeg-9-0-linux-build:
      needs: changes
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: 'ubuntu-22.04'
      timeout-minutes: 120
      outputs:
        artifact_name: ${{ env.LINUX_ARTIFACTS_9_0 }}
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup:  Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake nasm make gcc g++ pkg-config

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'install ffmpeg plugin'
        run: .github/scripts/build_ffmpeg_plugin.sh 9.0 y n

      - name: "Archive: upload artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.LINUX_ARTIFACTS_9_0 }}"
          retention-days: 30
          path: |
            install-dir/

  # ---------------------------------------------------------------------------------------------
  # ffmpeg plugin functional tests (tests/scripts/FFmpegDecoderConformanceTest.sh,
  # FFmpegDecoderMultiFramesTest.sh, FFmpegEncoderTest.sh), run against the ffmpeg binary built by
  # the corresponding *-linux-build job above, one job per Linux ffmpeg version. Runs on the same
  # self-hosted runners (with the same pre-staged /opt/samples bitstream set) as base_build.yaml's
  # linux-conformance-tests job, since these test scripts consume the exact same asset layout
  # (test_bitsreams/, reference_decode/, bitstream_multi_frames/, bitstream_invalid/,
  # encoder_tests/).
  # ---------------------------------------------------------------------------------------------

  ffmpeg-6-1-linux-tests:
      needs: [changes, ffmpeg-6-1-linux-build]
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'Setup: Download build artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "${{ env.LINUX_ARTIFACTS_6_1 }}"
          path: install-dir

      - name: 'Setup: Make ffmpeg executable'
        run: sudo chmod -R 755 install-dir/

      - name: 'ffmpeg plugin tests: run all'
        working-directory: ${{ github.workspace }}/tests/scripts
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib"
          ./ParallelAllFFmpegTests.sh ${{ env.JOBS_NUM }} "${{ env.INPUT_FILES_PATH }}" "${{ github.workspace }}/install-dir/bin/ffmpeg" dec

  ffmpeg-7-0-linux-tests:
      needs: [changes, ffmpeg-7-0-linux-build]
      if: ${{ needs.changes.outputs.changed == 'true' }}
      runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
      timeout-minutes: 120
      steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'Setup: Download build artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "${{ env.LINUX_ARTIFACTS_7_0 }}"
          path: install-dir

      - name: 'Setup: Make ffmpeg executable'
        run: sudo chmod -R 755 install-dir/

      - name: 'ffmpeg plugin tests: run all'
