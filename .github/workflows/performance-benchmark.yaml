name: Performance Benchmark

# Reusable workflow: called by base_build.yaml (after linux-build) and ffmpeg_plugin_build.yaml
# (after ffmpeg-9-0-linux-build) once their artifacts are ready, so builds are never duplicated
# here. Each caller passes only the artifact(s) it built; the corresponding job below runs, the
# other is skipped.
on:
  workflow_call:
    inputs:
      sample_app_artifact:
        description: 'Artifact name with Bin/Release (base_build.yaml linux-build). Runs sample-app-performance when set.'
        type: string
        required: false
        default: ''
      ffmpeg_plugin_artifact:
        description: 'Artifact name with install-dir/ (ffmpeg_plugin_build.yaml ffmpeg-9-0-linux-build). Runs ffmpeg-plugin-performance when set.'
        type: string
        required: false
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # Same pre-staged bitstream/YUV set used by base_build.yaml's linux-conformance-tests and
  # ffmpeg_plugin_build.yaml's *-linux-tests jobs.
  INPUT_FILES_PATH: /opt/samples

jobs:
  sample-app-performance:
    if: ${{ inputs.sample_app_artifact != '' }}
    runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
    timeout-minutes: 120
    steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup: Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get -y install numactl

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'Setup: Download build artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "${{ inputs.sample_app_artifact }}"

      - name: 'Run: SvtJpegxsEncApp/SvtJpegxsDecApp performance'
        # Both scripts default SAMPLES_DIR to ../../Conformance-tests (a local-dev-only, git-
        # ignored symlink - see `git ls-files Conformance-tests`, which is empty). That path
        # doesn't exist on a clean checkout, so explicitly pass INPUT_FILES_PATH (the same
        # pre-staged data used by base_build.yaml's linux-conformance-tests) as the samples_dir
        # argument instead.
        working-directory: tests/scripts
        run: |
          chmod +x "${{ github.workspace }}/Bin/Release/"*
          ./PerformanceTestSampleApp.sh "${{ env.INPUT_FILES_PATH }}" 2>&1 | tee sample_app_performance.log

      - name: "Archive: upload performance results"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sample-app-performance-results-${{ github.run_number }}
          retention-days: 90
          path: |
            tests/scripts/svt_app_results.csv
            tests/scripts/sample_app_performance.log

  ffmpeg-plugin-performance:
    if: ${{ inputs.ffmpeg_plugin_artifact != '' }}
    runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
    timeout-minutes: 120
    steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Setup: Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get -y install numactl

      - name: 'Checkout repository'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 'Setup: Download build artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "${{ inputs.ffmpeg_plugin_artifact }}"

      - name: 'Setup: Make ffmpeg executable'
        run: sudo chmod -R 755 install-dir/

      - name: 'Run: ffmpeg plugin performance'
        working-directory: tests/scripts
        run: |
          export PATH="${{ github.workspace }}/install-dir/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ffmpeg -hide_banner -encoders 2>&1 | grep -i libsvtjpegxs
          ./PerformanceTestFfmpegPlugin.sh "${{ env.INPUT_FILES_PATH }}" 2>&1 | tee ffmpeg_plugin_performance.log

      - name: "Archive: upload performance results"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ffmpeg-plugin-performance-results-${{ github.run_number }}
          retention-days: 90
          path: |
            tests/scripts/ffmpeg_results.csv
            tests/scripts/ffmpeg_plugin_performance.log
