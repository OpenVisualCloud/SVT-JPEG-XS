name: Coverity Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run scans on'
        default: 'main'
        type: string
env:
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  coverity:
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 90
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.branch }}

    - name: 'Install dependencies'
      working-directory: Build/linux
      run: | 
           sudo apt-get update
           sudo apt-get -y install nasm

    - name: 'Run coverity'
      uses: vapier/coverity-scan-action@8fe7b0af23cbbd4eced5f63dcd2384640eaa5d49 # v1.10.0
      with:
        project: 'SVT-JPEG-XS'
        email: ${{ secrets.COVERITY_SCAN_EMAIL }}
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
        build_language: 'cxx'
        build_platform: 'linux64'
        working-directory: '${{ github.workspace }}/Build/linux'
        command: '${{ github.workspace }}/Build/linux/build.sh --release'

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverity-reports
        # cov-build runs in the action's working-directory, so cov-int lands there.
        path: '${{ github.workspace }}/Build/linux/cov-int'
        if-no-files-found: error
