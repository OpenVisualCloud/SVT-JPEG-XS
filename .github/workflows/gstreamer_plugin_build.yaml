name: GStreamer Plugin Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  JOBS_NUM: 100
  INPUT_FILES_PATH: /opt/samples

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.gstreamer_plugin_build == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v2
        id: filter
        with:
          filters: .github/config/path_filters.yaml

  gstreamer-linux-build-test:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ['self-hosted', 'linux', 'x64', 'docker', 'kubernetes', 'valgrind']
    timeout-minutes: 120
    steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 'Setup: Install dependencies'
        run: |
            sudo apt-get update
            sudo apt-get -y install cmake make gcc g++ nasm ninja-build python3-venv pkg-config flex bison libglib2.0-dev

      - name: 'Build: SVT-JPEG-XS and minimal GStreamer with the svtjpegxs plugin'
        run: .github/scripts/build_gstreamer_plugin.sh

      - name: 'Build: Cleanup build tree (gst-build/ and .meson-venv/) to free disk space'
        run: |
          rm -rf "${{ github.workspace }}/gst-build"
          rm -rf "${{ github.workspace }}/.meson-venv"

      - name: 'Test: GStreamer plugin test suites (parallel)'
        working-directory: ${{ github.workspace }}/tests/scripts
        run: |
          source ${{ github.workspace }}/gst-plugin-env.sh
          ./ParallelAllGstreamerTests.sh ${{ env.JOBS_NUM }} "${{ env.INPUT_FILES_PATH }}"

      - name: 'Upload test logs on failure'
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gstreamer-test-logs-${{ github.run_number }}
          retention-days: 14
          path: tests/scripts/tmp/

      - name: 'Cleanup workspace'
        if: always()
        run: git clean -ffdx
