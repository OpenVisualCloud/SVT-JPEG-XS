name: Sanitizer Tests

on:
  schedule:
    - cron: '0 18 * * *'  # Daily 18:00 UTC (20:00 CEST / 19:00 CET)
  workflow_dispatch:
  push:
    branches: ['ajanczew-sanitizers']  # TODO: remove before merge

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS_NUM: 16

jobs:
  # Build with the selected sanitizer, run the tests, and gate on the report -
  # all encapsulated in tests/scripts/sanitize.sh so the exact CI run reproduces
  # locally with one command:  tests/scripts/sanitize.sh <sanitizer>
  sanitizer:
    name: "Sanitizer: ${{ matrix.sanitizer }}"
    runs-on: ['self-hosted', 'linux', 'x64', 'valgrind', 'jpeg-perf']
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined, integer, memory]
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
      with:
        egress-policy: audit

    - name: 'Setup: Cleanup workspace'
      run: |
        rm -rf ./* || true
        rm -rf ./.??* || true

    - name: 'Checkout repository'
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: 'Setup: Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get -y install cmake nasm clang llvm make

    - name: 'Fix workspace permissions'
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Run sanitizer: ${{ matrix.sanitizer }}'
      # sanitize.sh builds with the sanitizer, runs unit (where applicable) +
      # conformance non-halting, writes the report to $GITHUB_STEP_SUMMARY and
      # gates via its exit code (integer is report-only).
      env:
        INPUT_FILES_PATH: /opt/samples
      run: |
        chmod +x tests/scripts/*.sh
        tests/scripts/sanitize.sh ${{ matrix.sanitizer }} --jobs ${{ env.JOBS_NUM }} --samples "$INPUT_FILES_PATH"

    - name: 'Archive: upload binaries and logs on failure'
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: sanitizer-${{ matrix.sanitizer }}-failure-${{ github.run_number }}
        retention-days: 7
        if-no-files-found: ignore
        path: |
          Bin/Release/SvtJpegxsUnitTests
          Bin/Release/SvtJpegxsEncApp
          Bin/Release/SvtJpegxsDecApp
          Bin/Debug/SvtJpegxsEncApp
          Bin/Debug/SvtJpegxsDecApp
          sanitizer-logs/${{ matrix.sanitizer }}-unit.log
          sanitizer-logs/${{ matrix.sanitizer }}-conformance.log

    # integer is report-only, so its job stays green; always archive its logs.
    - name: 'Archive: upload integer sanitizer report'
      if: always() && matrix.sanitizer == 'integer'
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: sanitizer-integer-report-${{ github.run_number }}
        retention-days: 7
        if-no-files-found: ignore
        path: |
          sanitizer-logs/integer-conformance.log

    - name: 'Cleanup: Remove workspace artifacts'
      if: always()
      run: |
        rm -rf Bin/ Build/linux/Release/ Build/linux/Debug/ || true

