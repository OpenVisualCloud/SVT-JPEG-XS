name: Sanitizer Tests

on:
  schedule:
    - cron: '0 18 * * *'  # Daily 18:00 UTC (20:00 CEST / 19:00 CET)
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + run + report/gate for every sanitizer is fully encapsulated in
  # tests/scripts/sanitize.sh, so the 'Run sanitizer' step below is a single-
  # line call that reproduces exactly with: tests/scripts/sanitize.sh <sanitizer>
  #
  # Each matrix job checks out for itself: every self-hosted runner has its own
  # _work tree, so a workspace prepared by one job is not visible to a job that
  # lands on a different runner.
  sanitizer:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sanitizer: [address, thread, undefined, integer, memory]
    name: "Sanitizer: ${{ matrix.sanitizer }}"
    runs-on: ['self-hosted', 'linux', 'x64', 'jpeg-xs']
    timeout-minutes: 180
    env:
      INPUT_FILES_PATH: /opt/samples
    steps:
    # Harden Runner is per-job network egress monitoring, not shared setup -
    # it has to run in every job it should actually cover, so it's repeated here.
    - name: 'Harden Runner'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: 'Setup: Cleanup workspace'
      run: |
        rm -rf ./* || true
        rm -rf ./.??* || true

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 'Verify host toolchain'
      run: |
        missing=()
        for t in cmake nasm make gcc g++ pkg-config ninja valgrind numactl flex bison clang; do
          command -v "$t" >/dev/null 2>&1 || missing+=("$t")
        done
        if ((${#missing[@]})); then
          echo "::error::Runner is missing: ${missing[*]} — see documentation/ci-cd/self-hosted-runner-setup.md"
          exit 1
        fi

    - name: 'Fix workspace permissions'
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true
        chmod +x tests/scripts/*.sh

    # report-only for integer: sanitize.sh's internal --no-gate means this
    # step (and therefore this job) only fails on a genuine infra/build
    # crash, never on findings alone.
    - name: 'Run sanitizer: ${{ matrix.sanitizer }}'
      run: tests/scripts/sanitize.sh ${{ matrix.sanitizer }} --samples "$INPUT_FILES_PATH"

    - name: 'Archive: upload logs'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sanitizer-logs-${{ matrix.sanitizer }}-${{ github.run_number }}
        retention-days: 7
        if-no-files-found: ignore
        path: |
          sanitizer-logs/*.log

    - name: 'Cleanup: Remove workspace artifacts'
      if: always()
      run: |
        # Fix ownership/perms here too (not just after checkout) so a build that left
        # root-owned or locked files doesn't leave them stuck for the next run.
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true
        rm -rf Bin/ Build/linux/Release/ Build/linux/Debug/ || true

  # Every matrix job above already gates itself via sanitize.sh's own exit
  # code, and fail-fast: false means one failing sanitizer never skips/cancels
  # the rest - so this job is only a single final pass/fail line covering all
  # 5 in one place. Runs on a regular hosted runner (not self-hosted): it does
  # nothing but read the other jobs' aggregated results, so it doesn't need -
  # and shouldn't consume - the constrained self-hosted pool.
  gate:
    name: 'Gate: report overall sanitizer result'
    needs: [sanitizer]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: 'Check sanitizer matrix result'
      run: |
        sanitizer_results="${{ needs.sanitizer.result }}"
        echo "Sanitizer matrix result: $sanitizer_results"
        if [[ "$sanitizer_results" != "success" ]]; then
          echo "::error::One or more sanitizer jobs failed - see the per-sanitizer job above for details."
          exit 1
        fi
        echo "All sanitizer jobs passed."


