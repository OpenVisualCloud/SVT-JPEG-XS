name: Sanitizer Tests

on:
  schedule:
    - cron: '0 18 * * 5'  # Weekly: Friday 18:00 UTC (20:00 CEST / 19:00 CET)
  workflow_dispatch:
  push:
    branches: ['ajanczew-sanitizers']  # TODO: remove before merge

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS_NUM: 16

jobs:
  # ── Address / Thread / Undefined / Integer sanitizers ──────────────────────
  # All built as Release with clang; unit tests run via parrallelUT.sh.
  sanitizer-unit-tests:
    name: "Unit tests: ${{ matrix.sanitizer }} sanitizer"
    runs-on: ['self-hosted', 'linux', 'x64', 'docker', 'kubernetes', 'valgrind']
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
          - sanitizer: thread
          - sanitizer: undefined
          - sanitizer: integer
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
      with:
        egress-policy: audit

    - name: 'Setup: Cleanup workspace'
      run: |
        rm -rf ./* || true
        rm -rf ./.??* || true

    - name: 'Checkout repository'
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: 'Setup: Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get -y install cmake nasm clang make

    - name: 'Fix workspace permissions'
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Build: release with ${{ matrix.sanitizer }} sanitizer'
      working-directory: Build/linux
      run: |
        ./build.sh release test sanitizer=${{ matrix.sanitizer }} cc=clang cxx=clang++ jobs=$(nproc)

    - name: 'Unit tests: ${{ matrix.sanitizer }} sanitizer (release)'
      env:
        UBSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/config/ubsan_suppressions.txt:print_stacktrace=1:halt_on_error=${{ matrix.sanitizer == 'integer' && '0' || '1' }}"
      run: |
        cd Bin/Release/
        chmod +x ${{ github.workspace }}/tests/scripts/parrallelUT.sh
        chmod +x ./*
        export LD_LIBRARY_PATH=$(pwd)
        mkdir -p "${{ github.workspace }}/sanitizer-logs"
        # pipefail so a failing shard is not masked by tee
        set -o pipefail
        ${{ github.workspace }}/tests/scripts/parrallelUT.sh ./SvtJpegxsUnitTests ${{ env.JOBS_NUM }} \
          2>&1 | tee "${{ github.workspace }}/sanitizer-logs/unit-tests-${{ matrix.sanitizer }}.log"

    - name: 'App tests: ${{ matrix.sanitizer }} sanitizer (release)'
      env:
        UBSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/config/ubsan_suppressions.txt:print_stacktrace=1:halt_on_error=${{ matrix.sanitizer == 'integer' && '0' || '1' }}"
      run: |
        mkdir -p "${{ github.workspace }}/sanitizer-logs"
        # pipefail so an app failure is not masked by tee
        set -o pipefail
        bash "${{ github.workspace }}/tests/scripts/sanitizer_app_test.sh" \
          "${{ github.workspace }}/Bin/Release" auto \
          2>&1 | tee "${{ github.workspace }}/sanitizer-logs/app-tests-${{ matrix.sanitizer }}.log"

    - name: 'Archive: upload binary and logs on failure'
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: sanitizer-${{ matrix.sanitizer }}-failure-${{ github.run_number }}
        retention-days: 7
        path: |
          Bin/Release/SvtJpegxsUnitTests
          sanitizer-logs/unit-tests-${{ matrix.sanitizer }}.log
          sanitizer-logs/app-tests-${{ matrix.sanitizer }}.log

    # Integer sanitizer runs report-only (halt_on_error=0), so the job stays
    # green; always archive its logs so the findings are not lost.
    - name: 'Archive: upload integer sanitizer report'
      if: always() && matrix.sanitizer == 'integer'
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: sanitizer-integer-report-${{ github.run_number }}
        retention-days: 7
        path: |
          sanitizer-logs/unit-tests-integer.log
          sanitizer-logs/app-tests-integer.log

    - name: 'Cleanup: Remove workspace artifacts'
      if: always()
      run: |
        rm -rf Bin/ Build/linux/Release/ || true

  # ── Memory sanitizer ────────────────────────────────────────────────────────
  # Must be Debug (release does not build with MSan).
  # Unit tests can't run under MSan: gtest aborts during global init. 
  # Use the C encoder/decoder apps instead.
  sanitizer-memory:
    name: "App tests: memory sanitizer"
    runs-on: ['self-hosted', 'linux', 'x64', 'docker', 'kubernetes', 'valgrind']
    timeout-minutes: 180
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
      with:
        egress-policy: audit

    - name: 'Setup: Cleanup workspace'
      run: |
        rm -rf ./* || true
        rm -rf ./.??* || true

    - name: 'Checkout repository'
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: 'Setup: Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get -y install cmake nasm clang make

    - name: 'Fix workspace permissions'
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Build: debug with memory sanitizer'
      working-directory: Build/linux
      run: |
        ./build.sh debug test sanitizer=memory cc=clang cxx=clang++ jobs=$(nproc)

    - name: 'App tests: memory sanitizer (debug)'
      run: |
        mkdir -p "${{ github.workspace }}/sanitizer-logs"
        # pipefail so an app failure is not masked by tee
        set -o pipefail
        # avx2: AVX-512 paths produce MSan false positives
        bash "${{ github.workspace }}/tests/scripts/sanitizer_app_test.sh" \
          "${{ github.workspace }}/Bin/Debug" avx2 \
          2>&1 | tee "${{ github.workspace }}/sanitizer-logs/memory-app-tests.log"

    - name: 'Archive: upload binaries and logs on failure'
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: sanitizer-memory-failure-${{ github.run_number }}
        retention-days: 7
        path: |
          Bin/Debug/SvtJpegxsEncApp
          Bin/Debug/SvtJpegxsDecApp
          sanitizer-logs/memory-app-tests.log

    - name: 'Cleanup: Remove workspace artifacts'
      if: always()
      run: |
        rm -rf Bin/ Build/linux/Debug/ || true
