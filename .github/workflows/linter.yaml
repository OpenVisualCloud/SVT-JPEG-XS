name: Linter
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run the scans on
        default: main
        type: string

permissions:
  contents: read

jobs:
  super-linter:
    name: super-linter
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.sha }}

      - name: Lint
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          DISABLE_ERRORS: false
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASH_FILE_NAME: .shellcheck
          BASH_SEVERITY: "error"
          LINTER_RULES_PATH: ".github/config"
          GITHUB_COMMENT_ON_PR: false
          # Per-language status checks need 'statuses: write'; the job summary covers it.
          MULTI_STATUS: false
          VALIDATE_BASH_EXEC: true
          VALIDATE_BASH: true
          # VALIDATE_CPP: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_JSONC_PRETTIER: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PROTOBUF: true
          VALIDATE_PYTHON_BLACK: true
