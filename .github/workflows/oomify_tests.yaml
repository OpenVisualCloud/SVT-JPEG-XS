name: OOMify Tests

on:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if no relevant paths changed'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: oomify-tests-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # 'force' is a workflow_dispatch checkbox that skips the path filter. dispatch
      # inputs arrive as strings, so compare against 'true' rather than the boolean.
      changed: ${{ steps.filter.outputs.oomify_tests == 'true' || inputs.force == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/config/path_filters.yaml

  oomify-tests:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    name: "OOMify: malloc failure injection"
    runs-on: ['self-hosted', 'linux', 'x64', 'jpeg-xs']
    timeout-minutes: 60
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 'Fix workspace permissions'
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Verify host toolchain'
      run: |
        missing=()
        for t in cmake nasm make gcc g++ pkg-config ninja valgrind numactl flex bison clang; do
          command -v "$t" >/dev/null 2>&1 || missing+=("$t")
        done
        if ((${#missing[@]})); then
          echo "::error::Runner is missing: ${missing[*]} — see documentation/ci-cd/self-hosted-runner-setup.md"
          exit 1
        fi

    - name: 'Setup: Download pre-built svt-jpegxs artifact from Base Build (falls back to local build if missing)'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: linux-svtjpegxs-install
        path: install-dir

    - name: 'Build: SVT-JPEG-XS release (skipped when Base Build artifact is reused)'
      working-directory: Build/linux
      run: |
        if find "${{ github.workspace }}/install-dir" -name 'SvtJpegxs.pc' 2>/dev/null | grep -q .; then
          echo "Reusing svt-jpegxs artifact from Base Build workflow run, skipping rebuild."
        else
          ./build.sh install --prefix "${{ github.workspace }}/install-dir"
        fi

    - name: 'Setup: Make svt-jpegxs artifact executable'
      run: sudo chmod -R 755 install-dir/

    # runner.temp is unique per runner and cleaned between jobs, so concurrent jobs on the same
    # host each get their own source tree instead of racing over a shared /tmp path.
    - name: 'Setup: Build oomify'
      env:
        OOMIFY_SRC: ${{ runner.temp }}/oomify-src
      run: |
        git init -q "$OOMIFY_SRC"
        git -C "$OOMIFY_SRC" fetch -q --depth 1 \
          https://github.com/tavianator/oomify.git a1cdde8aab003b4f720cda6bee6b4290fde8b49b
        git -C "$OOMIFY_SRC" checkout -q FETCH_HEAD
        make -C "$OOMIFY_SRC"
        mkdir -p "${{ github.workspace }}/oomify-bin"
        cp "$OOMIFY_SRC/oomify" "$OOMIFY_SRC/liboomify.so" "${{ github.workspace }}/oomify-bin/"

    - name: 'Test: OOMify fault injection'
      run: |
        chmod +x tests/scripts/OomifyTest.sh
        mkdir -p oomify-logs
        set -o pipefail
        export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        tests/scripts/OomifyTest.sh \
          "${{ github.workspace }}/install-dir/bin" \
          "${{ github.workspace }}/oomify-bin" \
          2>&1 | tee oomify-logs/oomify-test.log

    - name: 'Archive: upload logs on failure'
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: oomify-failure-${{ github.run_number }}
        retention-days: 7
        path: |
          oomify-logs/oomify-test.log
          install-dir/
