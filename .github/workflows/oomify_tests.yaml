name: OOMify Tests

on:
  workflow_run:
    workflows: ["Base Build"]
    types: [completed]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read  # required to download artifacts from the triggering workflow run

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  oomify-tests:
    name: "OOMify: malloc failure injection"
    # Skip if triggered by a failed Base Build; always run for pull_request/workflow_dispatch.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ['self-hosted', 'linux', 'x64', 'valgrind']
    timeout-minutes: 60
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: 'Setup: Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get -y install cmake nasm make gcc g++

    - name: 'Setup: Download SVT-JPEG-XS install tree from Base Build'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: linux-svtjpegxs-install
        path: install-dir
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Build: SVT-JPEG-XS release (skipped when Base Build artifact is reused)'
      working-directory: Build/linux
      run: |
        if find "${{ github.workspace }}/install-dir" -name 'SvtJpegxs.pc' 2>/dev/null | grep -q .; then
          echo "Reusing svt-jpegxs artifact from Base Build workflow run, skipping rebuild."
        else
          ./build.sh install --prefix "${{ github.workspace }}/install-dir"
        fi

    - name: 'Fix workspace permissions'
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Setup: Build oomify'
      run: |
        git clone --depth 1 https://github.com/tavianator/oomify.git \
          --no-local /tmp/oomify-src-${{ github.run_id }}
        git -C /tmp/oomify-src-${{ github.run_id }} checkout a1cdde8aab003b4f720cda6bee6b4290fde8b49b
        make -C /tmp/oomify-src-${{ github.run_id }}
        mkdir -p "${{ github.workspace }}/oomify-bin"
        cp /tmp/oomify-src-${{ github.run_id }}/oomify \
           /tmp/oomify-src-${{ github.run_id }}/liboomify.so \
          "${{ github.workspace }}/oomify-bin/"

    - name: 'Test: OOMify fault injection'
      run: |
        chmod +x install-dir/bin/SvtJpegxsEncApp install-dir/bin/SvtJpegxsDecApp
        chmod +x tests/scripts/OomifyTest.sh
        mkdir -p oomify-logs
        set -o pipefail
        # libSvtJpegxs.so is in lib64/ (separate from the app binaries in bin/).
        export LD_LIBRARY_PATH="${{ github.workspace }}/install-dir/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        tests/scripts/OomifyTest.sh \
          "${{ github.workspace }}/install-dir/bin" \
          "${{ github.workspace }}/oomify-bin" \
          2>&1 | tee oomify-logs/oomify-test.log

    - name: 'Archive: upload logs on failure'
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: oomify-failure-${{ github.run_number }}
        retention-days: 7
        path: |
          oomify-logs/oomify-test.log
          install-dir/bin/SvtJpegxsEncApp
          install-dir/bin/SvtJpegxsDecApp
