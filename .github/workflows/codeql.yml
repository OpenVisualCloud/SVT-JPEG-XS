name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

env:
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 'Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get -y install nasm

    - name: 'Initialize CodeQL'
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: c-cpp
        build-mode: manual
        config-file: ./.github/codeql/codeql-config.yml

    # Release only: unit tests are opt-in via the 'test' argument and pull in vendored googletest.
    - name: 'Build'
      working-directory: Build/linux
      run: ./build.sh --release --jobs=4

    - name: 'Perform CodeQL Analysis'
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:c-cpp"
