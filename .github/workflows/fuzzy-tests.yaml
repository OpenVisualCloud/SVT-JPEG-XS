name: Fuzzy Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        type: string
        default: 'main'
      timeout:
        description: 'test time [seconds] (default: 60)'
        type: number
        required: false
        default: 60

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  JOBS_NUM: 100
  TIMEOUT_SECONDS: ${{ inputs.timeout || 60 }}
jobs:
  build-lib:
    runs-on: ['self-hosted', 'linux', 'x64', 'jpeg-xs']
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: 'Verify host toolchain'
      run: |
        missing=()
        for t in cmake nasm make gcc g++ pkg-config ninja valgrind numactl flex bison clang; do
          command -v "$t" >/dev/null 2>&1 || missing+=("$t")
        done
        if ((${#missing[@]})); then
          echo "::error::Runner is missing: ${missing[*]} — see documentation/ci-cd/self-hosted-runner-setup.md"
          exit 1
        fi

    - name: Fix workspace permissions
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Setup: Download pre-built svt-jpegxs artifact from Base Build (falls back to local build if missing)'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        name: linux-svtjpegxs-install
        path: install-dir

    - name: 'Build: SVT-JPEG-XS once, reused by decoder+encoder fuzzer jobs (skipped if reused from Base Build)'
      working-directory: Build/linux
      run: |
        if find "${{ github.workspace }}/install-dir" -name 'SvtJpegxs.pc' 2>/dev/null | grep -q .; then
          echo "Reusing svt-jpegxs artifact from Base Build workflow run, skipping rebuild."
        else
          ./build.sh install --prefix "${{ github.workspace }}/install-dir"
        fi

    - name: "Archive: upload artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzzy-tests-svtjpegxs-lib-${{ github.run_number }}
        retention-days: 1
        path: |
          install-dir/

  decoder:
    needs: build-lib
    runs-on: ['self-hosted', 'linux', 'x64', 'jpeg-xs']
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: 'Verify host toolchain'
      run: |
        missing=()
        for t in cmake nasm make gcc g++ pkg-config ninja valgrind numactl flex bison clang; do
          command -v "$t" >/dev/null 2>&1 || missing+=("$t")
        done
        if ((${#missing[@]})); then
          echo "::error::Runner is missing: ${missing[*]} — see documentation/ci-cd/self-hosted-runner-setup.md"
          exit 1
        fi

    - name: Fix workspace permissions
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Setup: Download pre-built svt-jpegxs artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: fuzzy-tests-svtjpegxs-lib-${{ github.run_number }}
        path: install-dir

    - name: 'Setup: Make svt-jpegxs artifact executable'
      run: sudo chmod -R 755 install-dir/

    - name: 'Build: fuzzer binaries'
      run: |
        .github/scripts/fuzzy_tests.sh -b
      env:
        SVT_INSTALL_DIR: ${{ github.workspace }}/install-dir

    - name: "Run: Decoder fuzzing tests"
      run: |
        .github/scripts/fuzzy_tests.sh -td
      env:
        SVT_INSTALL_DIR: ${{ github.workspace }}/install-dir
        INPUT_FILES_PATH: /opt/samples/test_bitsreams

  encoder:
    needs: [build-lib, decoder]
    runs-on: ['self-hosted', 'linux', 'x64', 'jpeg-xs']
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: 'Verify host toolchain'
      run: |
        missing=()
        for t in cmake nasm make gcc g++ pkg-config ninja valgrind numactl flex bison clang; do
          command -v "$t" >/dev/null 2>&1 || missing+=("$t")
        done
        if ((${#missing[@]})); then
          echo "::error::Runner is missing: ${missing[*]} — see documentation/ci-cd/self-hosted-runner-setup.md"
          exit 1
        fi

    - name: Fix workspace permissions
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
        chmod -R u+rwX "$GITHUB_WORKSPACE" || true

    - name: 'Setup: Download pre-built svt-jpegxs artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: fuzzy-tests-svtjpegxs-lib-${{ github.run_number }}
        path: install-dir

    - name: 'Setup: Make svt-jpegxs artifact executable'
      run: sudo chmod -R 755 install-dir/

    - name: 'Build: fuzzer binaries'
      run: |
        .github/scripts/fuzzy_tests.sh -b
      env:
        SVT_INSTALL_DIR: ${{ github.workspace }}/install-dir

    - name: "Run: Encoder fuzzing tests"
      run: |
        .github/scripts/fuzzy_tests.sh -te
      env:
        SVT_INSTALL_DIR: ${{ github.workspace }}/install-dir