version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into a single PR; majors stay separate for review.
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
